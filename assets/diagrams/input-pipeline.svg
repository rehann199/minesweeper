<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Minesweeper input pipeline</title>
  <desc id="d">Three native input sources, touch, Android TV D-pad key events and Apple TV Siri Remote presses, are translated into the same small set of intents: reveal, flag, move cursor and pause. The intents drive a pure game-logic layer that returns a new immutable grid, which updates observable state and then the user interface, audio and, on mobile, haptics.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6ecff; }
      .h { font-size: 26px; font-weight: 700; }
      .s { font-size: 15px; fill: #9fb0d9; }
      .b { font-size: 15px; }
      .k { font-size: 13px; fill: #8ea2d8; letter-spacing: 1.4px; font-weight: 700; }
      .mob { fill: #12304a; stroke: #2f7fc1; stroke-width: 2; }
      .tv  { fill: #3a2414; stroke: #d9822b; stroke-width: 2; }
      .tvos { fill: #2a1a3d; stroke: #9a6fe0; stroke-width: 2; }
      .sh  { fill: #1a2a55; stroke: #5b78d6; stroke-width: 2; }
      .out { fill: #14283a; stroke: #3aa7a0; stroke-width: 1.5; }
      .arrow { stroke: #5b78d6; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b78d6"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="16" fill="#0b1020"/>
  <text x="40" y="50" class="h">Three input models, one intent vocabulary</text>
  <text x="40" y="76" class="s">Each platform handles its own hardware quirks, then calls the same game operations.</text>

  <text x="40" y="116" class="k">NATIVE INPUT</text>
  <rect x="40" y="130" width="300" height="130" rx="12" class="mob"/>
  <text x="58" y="158" class="k">TOUCH · ANDROID + IOS</text>
  <text x="58" y="186" class="b">Tap-up reveals</text>
  <text x="58" y="210" class="b">Long-press flags</text>
  <text x="58" y="234" class="b">Pinch / pan zoom · system back</text>

  <rect x="40" y="280" width="300" height="130" rx="12" class="tv"/>
  <text x="58" y="308" class="k">D-PAD · ANDROID TV</text>
  <text x="58" y="336" class="b">Arrow keys move the cursor</text>
  <text x="58" y="360" class="b">Select: tap reveals, hold flags</text>
  <text x="58" y="384" class="b">Back / escape pauses</text>

  <rect x="40" y="430" width="300" height="130" rx="12" class="tvos"/>
  <text x="58" y="458" class="k">SIRI REMOTE · APPLE TV</text>
  <text x="58" y="486" class="b">Move commands move the cursor</text>
  <text x="58" y="510" class="b">Select press tracker: tap or hold</text>
  <text x="58" y="534" class="b">Menu button pauses</text>

  <path d="M340 195 H400" class="arrow"/>
  <path d="M340 345 H400" class="arrow"/>
  <path d="M340 495 H400" class="arrow"/>

  <rect x="400" y="130" width="220" height="430" rx="12" class="sh"/>
  <text x="418" y="158" class="k">INTENT</text>
  <text x="418" y="196" class="b">Reveal cell</text>
  <text x="418" y="232" class="b">Toggle flag</text>
  <text x="418" y="268" class="b">Move cursor</text>
  <text x="418" y="304" class="b">Use hint</text>
  <text x="418" y="340" class="b">Pause / exit</text>
  <text x="418" y="400" class="s">Guards: paused, over,</text>
  <text x="418" y="422" class="s">dialog open, first reveal</text>

  <path d="M620 345 H680" class="arrow"/>

  <rect x="680" y="130" width="230" height="430" rx="12" class="sh"/>
  <text x="698" y="158" class="k">GAME LOGIC (PURE)</text>
  <text x="698" y="196" class="b">First reveal: generate</text>
  <text x="698" y="218" class="b">mines outside 3x3 zone</text>
  <text x="698" y="256" class="b">Stack-based flood fill</text>
  <text x="698" y="292" class="b">Flag toggle</text>
  <text x="698" y="328" class="b">Win / loss check</text>
  <text x="698" y="364" class="b">Hint · bomb recovery</text>
  <text x="698" y="400" class="b">Score calculation</text>
  <text x="698" y="460" class="s">Returns a new immutable</text>
  <text x="698" y="482" class="s">grid on every change</text>

  <path d="M910 230 H970" class="arrow"/>

  <rect x="970" y="130" width="190" height="200" rx="12" class="sh"/>
  <text x="988" y="158" class="k">STATE</text>
  <text x="988" y="196" class="b">Riverpod notifier</text>
  <text x="988" y="218" class="s">Mobile, Android TV</text>
  <text x="988" y="256" class="b">ObservableObject</text>
  <text x="988" y="278" class="s">Apple TV</text>

  <path d="M1065 330 V380" class="arrow"/>

  <rect x="970" y="380" width="190" height="180" rx="12" class="out"/>
  <text x="988" y="408" class="k">FEEDBACK</text>
  <text x="988" y="440" class="b">UI rebuild</text>
  <text x="988" y="466" class="b">Synthesised audio</text>
  <text x="988" y="492" class="b">Haptics (mobile)</text>
  <text x="988" y="518" class="b">Focus highlight (TV)</text>
</svg>
